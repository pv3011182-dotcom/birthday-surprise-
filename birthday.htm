<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 🎂</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

.container {
    text-align: center;
    width: 90%;
    max-width: 500px;
    z-index: 10;
}

.card {
    padding: 30px 20px;
    border-radius: 25px;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
}

h1 {
    font-size: 35px;
    margin-bottom: 10px;
}

p {
    font-size: 18px;
}

input {
    width: 90%;
    padding: 14px;
    border: none;
    border-radius: 30px;
    outline: none;
    font-size: 17px;
    text-align: center;
    margin: 15px 0;
}

button {
    padding: 13px 28px;
    border: none;
    border-radius: 30px;
    background: #ff4081;
    color: white;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,.25);
}

button:active {
    transform: scale(.95);
}

#surprise {
    display: none;
}

.name {
    font-size: 42px;
    font-weight: bold;
    animation: glow 1.5s infinite alternate;
}

.message {
    line-height: 1.6;
    animation: fadeIn 2s ease;
}

.cake {
    font-size: 100px;
    animation: bounce 1.5s infinite;
}

.heart {
    position: fixed;
    font-size: 25px;
    animation: floatUp 5s linear forwards;
    pointer-events: none;
}

.balloon {
    position: fixed;
    bottom: -100px;
    font-size: 55px;
    animation: balloonUp 7s linear forwards;
    pointer-events: none;
}

.confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    top: -20px;
    animation: fall 4s linear forwards;
}

@keyframes glow {
    from {
        text-shadow: 0 0 5px white;
    }
    to {
        text-shadow: 0 0 25px #fff, 0 0 45px #ff4081;
    }
}

@keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-18px); }
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(.7); }
    to { opacity: 1; transform: scale(1); }
}

@keyframes balloonUp {
    from {
        transform: translateY(0) rotate(-10deg);
    }
    to {
        transform: translateY(-120vh) rotate(15deg);
    }
}

@keyframes floatUp {
    from {
        transform: translateY(0);
        opacity: 1;
    }
    to {
        transform: translateY(-110vh);
        opacity: 0;
    }
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- NAME SCREEN -->
    <div class="card" id="nameScreen">
        <h1>🎁 A Birthday Surprise 🎁</h1>
        <p>Birthday Girl ka naam enter karo 💕</p>

        <input
            type="text"
            id="girlName"
            placeholder="Enter name..."
            value="Shreya"
        >

        <br>

        <button onclick="startSurprise()">
            🎀 Open Surprise 🎀
        </button>
    </div>


    <!-- SURPRISE SCREEN -->
    <div class="card" id="surprise">

        <div class="cake">🎂</div>

        <h1>🎉 Happy Birthday 🎉</h1>

        <div class="name" id="displayName"></div>

        <p class="message">
            💖 May your day be filled with happiness,<br>
            endless smiles, beautiful memories<br>
            and lots of love! 💕
        </p>

        <h2>✨ Have an Amazing Birthday! ✨</h2>

        <p>🎈🎁💐🥳💖</p>

    </div>

</div>


<script>

function startSurprise() {

    let name = document.getElementById("girlName").value.trim();

    if (name === "") {
        name = "Shreya";
    }

    document.getElementById("displayName").innerText = name;

    document.getElementById("nameScreen").style.display = "none";
    document.getElementById("surprise").style.display = "block";

    // Balloons
    for (let i = 0; i < 18; i++) {

        let balloon = document.createElement("div");

        balloon.className = "balloon";

        balloon.innerHTML = ["🎈","🎈","🎈","💗","💜"][Math.floor(Math.random()*5)];

        balloon.style.left = Math.random() * 100 + "vw";

        balloon.style.animationDelay =
            Math.random() * 4 + "s";

        document.body.appendChild(balloon);

        setTimeout(() => balloon.remove(), 9000);
    }


    // Hearts
    for (let i = 0; i < 20; i++) {

        let heart = document.createElement("div");

        heart.className = "heart";

        heart.innerHTML =
            ["💖","💕","💗","💝","✨"][Math.floor(Math.random()*5)];

        heart.style.left = Math.random() * 100 + "vw";

        heart.style.bottom = "-30px";

        heart.style.animationDelay =
            Math.random() * 4 + "s";

        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 7000);
    }


    // Confetti
    for (let i = 0; i < 100; i++) {

        let confetti = document.createElement("div");

        confetti.className = "confetti";

        confetti.style.left = Math.random() * 100 + "vw";

        confetti.style.background =
            ["#ff4081","#ffd740","#40c4ff","#69f0ae","#ffffff"]
            [Math.floor(Math.random()*5)];

        confetti.style.animationDelay =
            Math.random() * 3 + "s";

        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 5000);
    }

}

</script>

</body>
</html>
